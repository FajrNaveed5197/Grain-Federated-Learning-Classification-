use_class_weights: true

train_manifest: manifests/train.csv
val_manifest: manifests/validation.csv
test1_manifest: manifests/test.csv
test2_manifest: manifests/test_07.csv
class_mapping: configs/classes.json

output_dir: results
checkpoint_dir: checkpoints
experiment_log: experiments/experiment_log.csv
